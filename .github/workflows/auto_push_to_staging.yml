name: Sync dev to staging

on:
  push:
    branches:
      - dev

jobs:
  push-to-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup GitHub CLI
        run: |
          sudo apt install gh -y
      
      - name: Authenticate GitHub CLI (with personal token)
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        run: |
          gh auth login
          gh auth setup-git

      - name: Push dev to staging
        run: |
          git checkout staging
          git merge dev --no-ff -m "Auto-merge from dev to staging"
          git push https://x-access-token:${{ secrets.ACTIONS_DEPLOY_TOKEN }}@github.com/${{ github.repository }} staging

      - name: Trigger sync-staging-to-production workflow
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        run: gh workflow run sync-staging-to-production.yml --ref staging

