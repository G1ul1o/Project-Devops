
name: Actions Pull_request_dev

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 2 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Build app ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cd frontend && npm ci && npm install && npm run build
