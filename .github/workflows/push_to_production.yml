name: Push_to_production

on:
  workflow_dispatch:
  push:
    branches:  
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
        IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/project_devops_images
        GCP_PROJECT:  ${{ secrets.GCP_PROJECT_ID }}  
        GCP_REGION: ${{ secrets.GCP_REGION }}             
        FRONTEND_SERVICE: project-frontend  
        BACKEND_SERVICE: project-backend
    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MLflow 
        run: pip install mlflow==2.22.0

      - name: Download model artifact from DagsHub
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/G1ul1o/Project-Devops.mlflow
 
        run: |
              python -c '
              import mlflow
              import os

              tracking_uri = os.environ["MLFLOW_TRACKING_URI"]
              client = mlflow.tracking.MlflowClient(tracking_uri=tracking_uri)
              experiment_name = "Project_Devops_Mlops"  # ou le nom de ton expérience
              experiment = client.get_experiment_by_name(experiment_name)
              if experiment is None:
                  raise Exception(f"Experiment {experiment_name} not found")
              runs = client.search_runs(experiment_ids=[experiment.experiment_id], order_by=["attributes.start_time DESC"], max_results=1)
              if not runs:
                  raise Exception("No runs found")
              run_id = runs[0].info.run_id
              print(f"Latest run_id: {run_id}")
              os.makedirs("model", exist_ok=True)
              os.system(f"mlflow artifacts download --run-id {run_id} --artifact-path model/XGBClassifier.pkl --dst-path model")
              '

      - name: Move model file to clean path
        run: |
            mv model/model/XGBClassifier.pkl model/XGBClassifier.pkl

      - name: Verify model file exists
        run: |
          echo "Listing contents of model directory:"
          ls -l model
          test -f model/XGBClassifier.pkl && echo "✅ Model file found!" || (echo "❌ Model file NOT found!" && exit 1)
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build Docker images
        run: |
          docker build -t $IMAGE_NAME:project_app_frontend ./frontend --build-arg REACT_APP_API_URL="https://$BACKEND_SERVICE-$GCP_REGION.a.run.app"
          docker build -t $IMAGE_NAME:project_app_backend -f ./backend/Dockerfile .

      - name: Push Docker images to Docker Hub
        run: |
          docker push $IMAGE_NAME:project_app_frontend
          docker push $IMAGE_NAME:project_app_backend

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
      
      - name: Authenticate with GCP
        run: |
            gcloud auth activate-service-account --key-file="${{ secrets.GCP_SA_KEY }}" 
            
      - name: Configure Docker for Google Cloud
        run: gcloud auth configure-docker --quiet
      
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image=$IMAGE_NAME:project_app_backend \
            --region=$GCP_REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image=$IMAGE_NAME:project_app_frontend \
            --region=$GCP_REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=80
            
      - name: Show deployed service URLs
        run: |
          echo "Backend URL: https://project-backend-$REGION.a.run.app"
          echo "Frontend URL: https://project-frontend-$REGION.a.run.app"
